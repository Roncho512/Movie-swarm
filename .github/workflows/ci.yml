name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Foundation tests
        run: python -m pytest tests -q

      # Separate pytest processes. Each agent imports its own package named src.
      - name: Production agent tests
        run: python -m pytest agents/05-production/tests -q

      - name: Sound designer tests
        run: python -m pytest agents/06-sound-designer/tests -q

      - name: QA agent tests
        run: python -m pytest agents/08-qa/tests -q

      - name: Validate The Last Marker
        run: python scripts/validate-schema.py --production productions/the-last-marker
